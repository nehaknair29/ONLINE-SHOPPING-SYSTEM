<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNest - Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px}
header .status{font-size:13px;color:#9ca3af}
header .status.live{color:#34d399}
header .status.error{color:#f87171}
main{max-width:1300px;margin:auto;padding:24px 5%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px #00000012}
.card .label{font-size:13px;color:#6b7280;margin-bottom:8px}
.card .value{font-size:28px;font-weight:800}
.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:20px}
.panel{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px #00000012}
.panel h2{font-size:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0f0f0}
th{color:#6b7280;font-weight:600;font-size:12px;text-transform:uppercase}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.badge.low{background:#fee2e2;color:#b91c1c}
.stars{color:#f59e0b}
.empty-row{color:#9ca3af;text-align:center;padding:20px}
.refresh-btn{background:#f59e0b;border:0;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:bold}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>ShopNest — Admin Dashboard</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="status" id="status">Connecting...</span>
    <button class="refresh-btn" onclick="loadAll()">Refresh now</button>
  </div>
</header>

<div id="errorDetails" style="max-width:1300px;margin:10px auto 0;padding:0 5%;font-size:13px;color:#b91c1c;font-family:monospace;white-space:pre-wrap"></div>

<main>
  <div class="cards" id="summaryCards">
    <div class="card"><div class="label">Total Customers</div><div class="value">—</div></div>
    <div class="card"><div class="label">Total Orders</div><div class="value">—</div></div>
    <div class="card"><div class="label">Total Products</div><div class="value">—</div></div>
    <div class="card"><div class="label">Total Revenue</div><div class="value">—</div></div>
    <div class="card"><div class="label">Units in Stock</div><div class="value">—</div></div>
  </div>

  <div class="panels">
    <div class="panel">
      <h2>Products per category</h2>
      <canvas id="categoryChart" height="220"></canvas>
    </div>
    <div class="panel">
      <h2>Orders by status</h2>
      <canvas id="statusChart" height="220"></canvas>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <h2>Low stock alert (below 10 units)</h2>
      <table id="lowStockTable">
        <thead><tr><th>Product</th><th>Stock</th></tr></thead>
        <tbody><tr><td colspan="2" class="empty-row">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Top rated products</h2>
      <table id="topRatedTable">
        <thead><tr><th>Product</th><th>Rating</th><th>Reviews</th></tr></thead>
        <tbody><tr><td colspan="3" class="empty-row">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const API_BASE = "http://127.0.0.1:5000";

function money(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
function setStatus(text, cls){
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + cls;
}

async function getJSON(path){
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 300); } catch (e) {}
    throw new Error(`${path} -> HTTP ${res.status}${detail ? ": " + detail : ""}`);
  }
  return res.json();
}

async function loadSummary(){
  const s = await getJSON("/dashboard/summary");
  const cards = document.querySelectorAll("#summaryCards .card .value");
  cards[0].textContent = s.total_customers;
  cards[1].textContent = s.total_orders;
  cards[2].textContent = s.total_products;
  cards[3].textContent = money(s.total_revenue);
  cards[4].textContent = s.total_stock_units;
}

async function loadCategoryChart(){
  const data = await getJSON("/dashboard/category-counts");
  const canvas = document.getElementById("categoryChart");
  const ctx = canvas.getContext("2d");

  // Size the canvas to its container at full resolution
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth - 40;
  const cssHeight = Math.max(220, data.length * 34);
  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  if (!data.length) return;

  const max = Math.max(...data.map(d => d.Product_Count), 1);
  const labelWidth = 170;
  const barAreaWidth = cssWidth - labelWidth - 40;
  const rowHeight = cssHeight / data.length;
  const barHeight = Math.min(20, rowHeight * 0.5);

  ctx.font = "13px Arial, sans-serif";
  ctx.textBaseline = "middle";

  data.forEach((d, i) => {
    const y = rowHeight * i + rowHeight / 2;
    const barWidth = (d.Product_Count / max) * barAreaWidth;

    ctx.fillStyle = "#374151";
    ctx.textAlign = "left";
    ctx.fillText(d.Category_Name, 0, y);

    ctx.fillStyle = "#f3f4f6";
    ctx.fillRect(labelWidth, y - barHeight / 2, barAreaWidth, barHeight);

    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(labelWidth, y - barHeight / 2, barWidth, barHeight);

    ctx.fillStyle = "#111827";
    ctx.textAlign = "left";
    ctx.fillText(d.Product_Count, labelWidth + barAreaWidth + 8, y);
  });
}

async function loadStatusChart(){
  const data = await getJSON("/dashboard/order-status");
  const canvas = document.getElementById("statusChart");
  const ctx = canvas.getContext("2d");
  const colors = ["#111827","#f59e0b","#10b981","#ef4444","#3b82f6","#8b5cf6"];

  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth - 40;
  const cssHeight = 260;
  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  if (!data.length) return;

  const total = data.reduce((sum, d) => sum + d.Order_Count, 0) || 1;
  const cx = cssWidth / 2;
  const cy = 100;
  const outerR = 80;
  const innerR = 48;

  let startAngle = -Math.PI / 2;
  data.forEach((d, i) => {
    const sliceAngle = (d.Order_Count / total) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, outerR, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    startAngle = endAngle;
  });

  // Cut out the center to make it a donut
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  // Legend below
  ctx.font = "12px Arial, sans-serif";
  ctx.textBaseline = "middle";
  const legendY = cy + outerR + 30;
  let x = 10;
  data.forEach((d, i) => {
    const label = `${d.Order_Status} (${d.Order_Count})`;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.arc(x + 5, legendY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#374151";
    ctx.textAlign = "left";
    ctx.fillText(label, x + 14, legendY);
    x += ctx.measureText(label).width + 34;
  });
}

async function loadLowStock(){
  const data = await getJSON("/dashboard/low-stock?threshold=10");
  const tbody = document.querySelector("#lowStockTable tbody");
  tbody.innerHTML = data.length
    ? data.map(p => `<tr><td>${p.Product_Name}</td><td><span class="badge low">${p.Stock_Quantity} left</span></td></tr>`).join("")
    : `<tr><td colspan="2" class="empty-row">No products are low on stock 🎉</td></tr>`;
}

async function loadTopRated(){
  const data = await getJSON("/dashboard/top-rated?limit=5");
  const tbody = document.querySelector("#topRatedTable tbody");
  tbody.innerHTML = data.length
    ? data.map(p => `<tr><td>${p.Product_Name}</td><td class="stars">${"★".repeat(Math.round(p.Avg_Rating))} ${p.Avg_Rating}</td><td>${p.Review_Count}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty-row">No reviews yet</td></tr>`;
}

const SECTIONS = [
  { name: "Summary cards", fn: loadSummary },
  { name: "Category chart", fn: loadCategoryChart },
  { name: "Order status chart", fn: loadStatusChart },
  { name: "Low stock table", fn: loadLowStock },
  { name: "Top rated table", fn: loadTopRated }
];

async function loadAll(){
  setStatus("Refreshing...", "");
  const failures = [];

  for (const section of SECTIONS) {
    try {
      await section.fn();
    } catch (err) {
      console.error(`${section.name} failed:`, err);
      failures.push(`${section.name}: ${err.message}`);
    }
  }

  if (failures.length === 0) {
    setStatus("● Live — connected to " + API_BASE, "live");
  } else if (failures.length === SECTIONS.length) {
    setStatus("⚠ Can't reach " + API_BASE + " at all. Is api.py running?", "error");
  } else {
    setStatus("⚠ " + failures.length + " of " + SECTIONS.length + " section(s) failed — see details below", "error");
  }

  const errBox = document.getElementById("errorDetails");
  errBox.innerHTML = failures.length
    ? failures.map(f => `<div>⚠ ${f}</div>`).join("")
    : "";
}

loadAll();
setInterval(loadAll, 15000); // auto-refresh every 15s
</script>
</body>
</html>
